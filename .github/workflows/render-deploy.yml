name: render-deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needs repo secret RENDER_DEPLOY_HOOK (Render dashboard -> service ->
    # Settings -> Deploy Hook). Kept separate from ci so a red build never
    # blocks a deploy decision — change `needs` if you want gating.
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK secret not set; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
